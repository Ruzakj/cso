name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Enable PS2 MAX CHD compression
        shell: python
        run: |
          from pathlib import Path
          p = Path("app/src/main/cpp/mame/src/tools/chdman.cpp")
          s = p.read_text()
          needle = 'params.insert(std::make_pair(OPTION_OUTPUT, &out));\n    try {\n        do_create_dvd(params);'
          insert = 'params.insert(std::make_pair(OPTION_OUTPUT, &out));\n    std::string compression = "lzma,zlib,huff,flac";\n    std::string hunksize = "1048576";\n    params.insert(std::make_pair(OPTION_COMPRESSION, &compression));\n    params.insert(std::make_pair(OPTION_HUNK_SIZE, &hunksize));\n    try {\n        do_create_dvd(params);'
          if needle not in s:
              raise SystemExit("createdvd JNI block not found")
          p.write_text(s.replace(needle, insert, 1))
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: CISO-PS2-MAX-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
