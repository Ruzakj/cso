name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Enable PS2 MAX CHD compression
        shell: python
        run: |
          from pathlib import Path
          p = Path("app/src/main/cpp/mame/src/tools/chdman.cpp")
          s = p.read_text()
          needle = """    params.insert(std::make_pair(OPTION_INPUT,&in));
    params.insert(std::make_pair(OPTION_OUTPUT, &out));
    try {
        do_create_dvd(params);"""
          replacement = """    params.insert(std::make_pair(OPTION_INPUT,&in));
    params.insert(std::make_pair(OPTION_OUTPUT, &out));
    // PS2 MAX: lossless CHD v5 using the strongest standard codec set.
    // 1 MiB hunks maximize cross-sector redundancy while remaining valid CHD.
    std::string compression = "lzma,zlib,huff,flac";
    std::string hunksize = "1048576";
    params.insert(std::make_pair(OPTION_COMPRESSION, &compression));
    params.insert(std::make_pair(OPTION_HUNK_SIZE, &hunksize));
    try {
        do_create_dvd(params);"""
          if needle not in s:
              raise SystemExit("createdvd JNI block not found")
          p.write_text(s.replace(needle, replacement, 1))
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ISO-to-CSO-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
