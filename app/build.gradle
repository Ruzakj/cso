plugins { id 'com.android.application' }

android {
    namespace 'id.ric.isotocso'
    compileSdk 35
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'id.ric.isotocso'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt' }
    }

    defaultConfig {
        externalNativeBuild {
            cmake { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        }
    }
}
